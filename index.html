    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

    h1 { text-align: center; font-size: 24px; font-weight: 800; margin-bottom: 6px; }
    .subtitle { text-align: center; font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    .progress { text-align: center; color: #666; margin-bottom: 22px; font-size: 14px; }
    .candidate-card {
      border-radius: 16px; padding: 20px; margin-bottom: 20px; color: white;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }
    .card-content { display: flex; gap: 16px; margin-bottom: 16px; }
    .candidate-card img {
      width: 90px; height: 90px; border-radius: 10px; object-fit: cover;
      border: 3px solid rgba(255,255,255,0.7); background: #ddd; flex-shrink: 0;
    }
    .info { flex: 1; }
    .name { font-size: 21px; font-weight: 700; margin-bottom: 4px; }
    .party { font-size: 15px; margin-bottom: 8px; opacity: 0.95; }
    .bio { font-size: 14px; line-height: 1.4; opacity: 0.95; }
    .vote-btn {
      display: block; width: 100%; background: #2563eb; color: white; border: none;
      padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    .results-card {
      background: white; border-radius: 14px; padding: 20px; margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1); color: #111;
    }
    .party-count { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
    button.restart { background: #ff3b30; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 700; width: 100%; margin-top: 10px; }
  </style>

      ]}
    ];

    let current = 0;
    let votes = [];

    function render() {
      const app = document.getElementById("app");

      if (current >= elections.length) {
        // Final results
        const partyCount = {};
        votes.forEach(v => {
          partyCount[v.party] = (partyCount[v.party] || 0) + 1;
        });

        let html = `<h1>Your Complete Ballot</h1>
          <div class="progress">You voted in all ${elections.length} elections</div>
          <div class="results-card"><h2 style="margin-bottom:14px">Candidates You Chose</h2>`;

        votes.forEach((v, i) => {
          html += `<div style="margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #eee">
            <strong>${elections[i].title}</strong><br>
            <span style="color:\( {v.color};font-weight:700"> \){v.name}</span> (${v.party})
          </div>`;
        });

        html += `</div><div class="results-card"><h2 style="margin-bottom:14px">Party Totals</h2>`;
        for (let p in partyCount) {
          html += `<div class="party-count"><span>\( {p}</span><strong> \){partyCount[p]} time${partyCount[p] > 1 ? "s" : ""}</strong></div>`;
        }
        html += `</div><button class="restart" onclick="restart()">Start Over</button>`;
        app.innerHTML = html;
        return;
      }

      const e = elections[current];
      let html = `<h1>U.S. Presidential Election Simulator</h1>
        <div class="subtitle">${e.title}</div>
        <div class="progress">Election ${current + 1} of ${elections.length}</div>`;

      e.candidates.forEach((c, index) => {
        html += `<div class="candidate-card" style="background:${c.color}">
          <div class="card-content">
            <img src="\( {c.image}" alt=" \){c.name}" onerror="this.src='https://via.placeholder.com/150?text=${encodeURIComponent(c.name)}'">
            <div class="info">
              <div class="name">${c.name}</div>
              <div class="party">Party: ${c.party}</div>
              <div class="bio">Bio: ${c.bio}</div>
            </div>
          </div>
          <button class="vote-btn" onclick="vote(${index})">Vote for ${c.name}</button>
        </div>`;
      });

      app.innerHTML = html;
    }

    function vote(index) {
      votes.push(elections[current].candidates[index]);
      current++;
      window.scrollTo(0, 0);
      render();
    }

    function restart() {
      current = 0;
      votes = [];
      render();
    }

    render();
  </script>

      ]},
      { year: 2024, title: "Election of 2024", candidates: [
        { name: "Donald Trump", party: "Republican", color: "#b71c1c", image: "https://via.placeholder.com/150?text=Trump", bio: "Former President. Won second non-consecutive term." },

      ]}
    ];

    let current = 0;
    let votes = [];

    function render() {
      const app = document.getElementById("app");

      if (current >= elections.length) {
        // Final results
        const partyCount = {};
        votes.forEach(v => {
          partyCount[v.party] = (partyCount[v.party] || 0) + 1;
        });

        let html = `<h1>Your Complete Ballot</h1>
          <div class="progress">You voted in all ${elections.length} elections</div>
          <div class="results-card"><h2 style="margin-bottom:14px">Candidates You Chose</h2>`;

        votes.forEach((v, i) => {
          html += `<div style="margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #eee">
            <strong>${elections[i].title}</strong><br>
            <span style="color:\( {v.color};font-weight:700"> \){v.name}</span> (${v.party})
          </div>`;
        });

        html += `</div><div class="results-card"><h2 style="margin-bottom:14px">Party Totals</h2>`;
        for (let p in partyCount) {
          html += `<div class="party-count"><span>\( {p}</span><strong> \){partyCount[p]} time${partyCount[p] > 1 ? "s" : ""}</strong></div>`;
        }
        html += `</div><button class="restart" onclick="restart()">Start Over</button>`;
        app.innerHTML = html;
        return;
      }

      const e = elections[current];
      let html = `<h1>U.S. Presidential Election Simulator</h1>
        <div class="subtitle">${e.title}</div>
        <div class="progress">Election ${current + 1} of ${elections.length}</div>`;

      e.candidates.forEach((c, index) => {
        html += `<div class="candidate-card" style="background:${c.color}">
          <div class="card-content">
            <img src="\( {c.image}" alt=" \){c.name}" onerror="this.src='https://via.placeholder.com/150?text=${encodeURIComponent(c.name)}'">
            <div class="info">
              <div class="name">${c.name}</div>
              <div class="party">Party: ${c.party}</div>
              <div class="bio">Bio: ${c.bio}</div>
            </div>
          </div>
          <button class="vote-btn" onclick="vote(${index})">Vote for ${c.name}</button>
        </div>`;
      });

      app.innerHTML = html;
    }

    function vote(index) {
      votes.push(elections[current].candidates[index]);
      current++;
      window.scrollTo(0, 0);
      render();
    }

    function restart() {
      current = 0;
      votes = [];
      render();
    }

    render();
  </script>
